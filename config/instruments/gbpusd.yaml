# Especificación del símbolo GBPUSD tal como lo publica Pepperstone en cTrader.
#
# IMPORTANTE: estos valores son el punto de partida y DEBEN verificarse contra la
# ficha del símbolo en tu cuenta real (cTrader > clic derecho en el símbolo >
# "Symbol Information"), porque cambian por entidad regulatoria y tipo de cuenta.
# Todo el motor lee de aquí: no hay números mágicos en el código.

symbol: GBPUSD
description: British Pound vs US Dollar

# --- Cotización ---
digits: 5 # decimales del precio
tick_size: 0.00001 # mínimo incremento de precio
pip_size: 0.0001 # un pip son 10 ticks en un par de 5 decimales
contract_size: 100000 # unidades de la divisa base por lote
# valor de un tick por lote = contract_size * tick_size = 1.00 USD

# --- Divisas ---
base_currency: GBP
quote_currency: USD
profit_currency: USD # coincide con la divisa de cuenta -> sin conversión FX

# --- Volumen ---
min_lot: 0.01
max_lot: 100.0
lot_step: 0.01

# --- Margen ---
leverage: 200 # VERIFICAR: en FX mayor suele ser más alto según la entidad

# --- Costes de transacción (cuenta Razor) ---
costs:
  spread_mode: fixed
  # Ticks, no pips: 8 ticks = 0.8 pips. VERIFICAR contra tu cuenta; en Razor el
  # spread bruto de EURUSD suele ser bastante menor y la comisión lo compensa.
  spread_points: 12
  # Comisión por lote y por lado. Razor FX ronda los 3,50 USD. VERIFICAR.
  commission_per_lot_per_side: 3.5
  slippage_points: 5

# --- Swap / financiación nocturna ---
# Puntos (ticks) cargados por lote y por noche. Negativo = coste. VERIFICAR:
# el swap cambia con los tipos y se revisa a diario.
swap:
  mode: points
  long_points: -6.0
  short_points: 1.0
  triple_swap_weekday: 2 # 0=lunes ... 4=viernes. Miércoles = triple en FX
  rollover_hour_server: 0

# --- Sesión de negociación (hora del servidor cTrader) ---
session:
  timezone: Europe/Athens # servidor cTrader Pepperstone = EET/EEST (UTC+2/+3)
  daily_break:
    start: "00:00"
    end: "01:00"
  week_open: { weekday: 6, time: "01:05" } # domingo
  week_close: { weekday: 4, time: "23:55" } # viernes
